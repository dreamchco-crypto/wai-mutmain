<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وعي يطمئن.. وطن آمن</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
      background: #f5f8f6;
      color: #075c37;
    }

    header {
      background: #075c37;
      color: white;
      padding: 25px 15px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .subtitle {
      color: #f6d98b;
      margin-top: 12px;
    }

    main {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 4px 14px #0002;
    }

    .message {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin: 25px 0;
      line-height: 2;
      font-size: 1.1rem;
    }

    audio {
      width: 100%;
      max-width: 550px;
      margin: 10px auto 30px;
    }

    footer {
      background: #075c37;
      color: white;
      padding: 18px;
    }
  </style>
</head>

<body>
  <header>
    <h1>وعي يطمئن.. وطن آمن</h1>
    <p class="subtitle">وعي يحمي • معرفة تطمئن</p>
  </header>

  <main>
    <img
      class="poster"
      src="poster.png"
      alt="مبادرة وعي يطمئن.. وطن آمن"
    >

    <section class="message">
      <h2>وعي يحمي.. معرفة تطمئن</h2>
      <p>
        مبادرة تربوية لتعزيز الوعي الفكري والرقمي والسلوكي،
        وبناء بيئة مدرسية آمنة ومطمئنة، تنمّي لدى الطالبات
        مهارات التحقق والحوار واتخاذ القرار المسؤول.
      </p>
      <h3>وعي يطمئن.. وطن آمن</h3>
    </section>

    <h2>استمعي إلى رسالة المبادرة</h2>
    <audio controls preload="metadata">
      <source src="FullSizeRender.mp3" type="audio/mpeg">
      متصفحك لا يدعم تشغيل الصوت.
    </audio>
  </main>

  <footer>
    مبادرة وعي يطمئن.. وطن آمن
  </footer>
</body>
</html>
